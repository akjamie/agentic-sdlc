# Local Jenkins quickstart to SEE the asdlc gate run.
#   docker compose up -d   ->   http://localhost:8080
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: asdlc-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Lets Jenkins spawn Docker agents (node:20) for the gate.
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  jenkins_home: