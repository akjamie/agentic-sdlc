name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Manual version bump type (patch, minor, major) - optional'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'patch'
          - 'minor'
          - 'major'
      tag:
        description: 'NPM dist-tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Check Version & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # If manual bump was requested via workflow_dispatch, bump and push commit
      - name: Manual Version Bump (if requested via workflow_dispatch)
        if: ${{ github.event.inputs.bump != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VER=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v${NEW_VER} [skip ci]"
          git push origin main

      - name: Determine Version & Published Status
        id: version_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Current package: $PKG_NAME@$PKG_VER"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_ver=$PKG_VER" >> "$GITHUB_OUTPUT"

          # Check if this exact version is already published on npm
          PUBLISHED_VER=$(npm view "$PKG_NAME@$PKG_VER" version 2>/dev/null || echo "")
          if [ "$PUBLISHED_VER" = "$PKG_VER" ]; then
            echo "Version $PKG_VER is already published on npm. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PKG_VER is NOT yet published on npm! Triggering release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version_check.outputs.should_release == 'true'
        run: npm ci

      - name: Run verification test suite
        if: steps.version_check.outputs.should_release == 'true'
        run: npm test

      - name: Create Git Tag & Push
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          VER="${{ steps.version_check.outputs.pkg_ver }}"
          TAG="v$VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version_check.outputs.pkg_ver }}"
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            echo "Release $TAG already exists."
          fi

      - name: Publish to NPM
        if: steps.version_check.outputs.should_release == 'true'
        run: npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
