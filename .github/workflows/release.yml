name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Manual version bump type (patch, minor, major) - optional'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'patch'
          - 'minor'
          - 'major'
      tag:
        description: 'NPM dist-tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Check Version & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # If manual bump was requested via workflow_dispatch, bump and push commit
      - name: Manual Version Bump (if requested via workflow_dispatch)
        if: ${{ github.event.inputs.bump != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VER=$(node -p "require('./package.json').version")
          git commit -am "chore(release): v${NEW_VER} [skip ci]"
          git push origin main

      - name: Determine Version & Published Status
        id: version_check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          echo "Current package: $PKG_NAME@$PKG_VER"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_ver=$PKG_VER" >> "$GITHUB_OUTPUT"

          # 1. Check public NPM registry
          NPM_VER=$(npm view "$PKG_NAME@$PKG_VER" version 2>/dev/null || echo "")
          if [ "$NPM_VER" = "$PKG_VER" ]; then
            echo "Version $PKG_VER is already published on npmjs.org."
            echo "release_npm=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PKG_VER is NOT yet published on npmjs.org! Will publish to NPM."
            echo "release_npm=true" >> "$GITHUB_OUTPUT"
          fi

          # 2. Check GitHub Packages registry
          echo "@akjamie:registry=https://npm.pkg.github.com" > /tmp/.gpr_npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> /tmp/.gpr_npmrc
          GPR_VER=$(NPM_CONFIG_USERCONFIG=/tmp/.gpr_npmrc npm view "$PKG_NAME@$PKG_VER" version --registry=https://npm.pkg.github.com 2>/dev/null || echo "")
          rm -f /tmp/.gpr_npmrc
          if [ "$GPR_VER" = "$PKG_VER" ]; then
            echo "Version $PKG_VER is already published on GitHub Packages."
            echo "release_gpr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PKG_VER is NOT yet published on GitHub Packages! Will publish to GitHub Packages."
            echo "release_gpr=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$NPM_VER" != "$PKG_VER" ] || [ "$GPR_VER" != "$PKG_VER" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "All registries up to date. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version_check.outputs.should_release == 'true'
        run: npm ci

      - name: Run verification test suite
        if: steps.version_check.outputs.should_release == 'true'
        run: npm test

      - name: Create Git Tag & Push
        if: steps.version_check.outputs.should_release == 'true'
        run: |
          VER="${{ steps.version_check.outputs.pkg_ver }}"
          TAG="v$VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version_check.outputs.pkg_ver }}"
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            echo "Release $TAG already exists."
          fi

      - name: Publish to NPM (npmjs.org)
        if: steps.version_check.outputs.release_npm == 'true'
        run: npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.version_check.outputs.release_gpr == 'true'
        run: |
          echo "@akjamie:registry=https://npm.pkg.github.com" > /tmp/gpr.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> /tmp/gpr.npmrc
          NPM_CONFIG_USERCONFIG=/tmp/gpr.npmrc npm publish --registry=https://npm.pkg.github.com --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
