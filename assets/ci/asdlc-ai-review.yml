name: ASDLC AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  spec-ai-review:
    name: Spec AI Review
    if: contains(github.event.pull_request.labels.*.name, 'asdlc:spec-review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Spec AI Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Dispatch independent AI spec reviewer (Player != Referee)
          # using asdlc-spec-review skill instructions.
          # The agent evaluates the PR diff, posts findings directly as a PR comment,
          # and sets the commit status check (asdlc/spec-ai-review).
          echo "Spec AI Review triggered for PR #${PR_NUMBER} in ${REPO}"

  impl-ai-review:
    name: Implementation AI Review
    if: contains(github.event.pull_request.labels.*.name, 'asdlc:impl-review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Implementation AI Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Dispatch independent AI implementation reviewer (Player != Referee)
          # using asdlc-impl-review skill instructions.
          # The agent evaluates the PR diff against approved specs, posts findings as a PR comment,
          # and sets the commit status check (asdlc/impl-ai-review).
          echo "Implementation AI Review triggered for PR #${PR_NUMBER} in ${REPO}"
